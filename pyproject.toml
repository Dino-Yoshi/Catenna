[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pipeline"
version = "0.1.0"
description = "Catenna: a deterministic multi-agent pipeline orchestrator"
requires-python = ">=3.8"

[project.scripts]
catenna = "agent_pipeline.cli:main"

[tool.setuptools]
packages = ["agent_pipeline"]
