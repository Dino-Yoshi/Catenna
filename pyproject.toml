[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catenna"
version = "0.1.0"
description = "A deterministic multi-agent pipeline orchestrator for coding-agent CLIs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dino-Yoshi" }]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/Dino-Yoshi/Catenna"

[project.scripts]
catenna = "agent_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["agent_pipeline*"]

[tool.setuptools.package-data]
"agent_pipeline.fixtures" = ["*.json"]
